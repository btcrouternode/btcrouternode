# SPDX-License-Identifier: GPL-2.0-only
# Appliance Knots dashboard — REQUIREMENTS B6/U1/N9/N13
# :80 → HTTPS except N13 trust downloads + U17 Setup while incomplete.
# :443 HTTPS UI. LuCI :8080 → :8443 (U1a). Wallet APIs → local uhttpd CGI.
# Redirects are ALWAYS 302 + Cache-Control: no-store — never 301. Browsers cache
# 301 permanently and replay it across reflashes/resets: a returning browser then
# jumps straight to HTTPS (new CA) and shows a cert warning before the IUE can
# start on HTTP (F135).

# S11 (review 2026-10-10) — LAN-only by the ROUTER address the request arrived
# on ($server_addr), not by client source range: LAN clients may use public
# IPv6 (GUA), and uhttpd never sees the client address (it does not forward
# X-Real-IP), so the CGI require_lan_client check cannot decide this.
# Private / ULA / link-local / loopback router addresses are LAN. The router's
# own public IPv6 LAN addresses come from knots-lan-addrs.map, rewritten by
# /etc/hotplug.d/iface/90-knots-lan-addrs on every lan ifup/ifupdate.
# Anything else (WAN public IPv4/IPv6) → 403, behind firewall reject_wan_luci.
# The router's nginx defaults map_hash_bucket_size to its 32-byte cache line;
# one hotplug-written IPv6 LAN key ("fdd4:d03a:fa17::1") already overflowed it
# and nginx refused to start (build .77). 128 fits a full 39-char IPv6 address.
# uci.conf does not set this; setting it twice is a fatal duplicate.
map_hash_bucket_size 128;

map $server_addr $knots_via_lan {
	default 0;
	include /etc/knots/nginx-lan-addrs.map;
	~^127\. 1;
	::1 1;
	~^10\. 1;
	~^192\.168\. 1;
	~^172\.(1[6-9]|2[0-9]|3[01])\. 1;
	~*^f[cd][0-9a-f]*: 1;
	~*^fe80: 1;
}

# S1 (review 2026-10-10) — DNS-rebinding guard. Every server answers only for
# the appliance's own names / private IP literals; any other Host (e.g. an
# attacker domain re-pointed at 192.168.1.254) gets 421 before reaching the
# APIs. .local/.lan names cannot be rebound from the internet.
map $host $knots_host_ok {
	default 0;
	localhost 1;
	node-router 1;
	knots-router 1;
	~^[a-z0-9-]+\.(lan|local)$ 1;
	~^(127|10)\.[0-9]+\.[0-9]+\.[0-9]+$ 1;
	~^192\.168\.[0-9]+\.[0-9]+$ 1;
	~^172\.(1[6-9]|2[0-9]|3[01])\.[0-9]+\.[0-9]+$ 1;
	~^\[[0-9a-f:.%]+\]$ 1;
}

# First-use captive portal (captive-portal.sh): while Setup is incomplete the
# router's DNS answers these connectivity-check names with its own address, and
# :80 replies with a redirect to Setup — the phone/laptop then shows "Sign in to
# network" and opens Setup by itself. Only a redirect is served for them (no
# content), and only until Setup completes; afterwards they are foreign hosts.
map $host $knots_captive {
	default 0;
	connectivitycheck.gstatic.com 1;
	connectivitycheck.android.com 1;
	clients3.google.com 1;
	www.google.com 1;
	play.googleapis.com 1;
	captive.apple.com 1;
	www.apple.com 1;
	www.appleiphonecell.com 1;
	www.msftconnecttest.com 1;
	www.msftncsi.com 1;
	detectportal.firefox.com 1;
	nmcheck.gnome.org 1;
	connectivity-check.ubuntu.com 1;
}

# D2/H3 (review 2026-10-11) — redirect host. Keep the name the browser used
# when it is one of the leaf certificate's SANs (rnode.local, node-router,
# knots-router); an IPv4 literal becomes the router's own address the request
# arrived on (the LAN IP — also a SAN), so clients without mDNS (DoH, VPN,
# some Android/Windows) are never bounced to an unresolvable rnode.local.
# Anything else falls back to rnode.local.
map $host $knots_rhost {
	default rnode.local;
	rnode.local rnode.local;
	node-router node-router;
	knots-router knots-router;
	# N20: the unit's own name (rnode-XXXX.local, in its leaf certificate)
	"~^rnode-[0-9a-f]{4}\.local$" $host;
	~^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ $server_addr;
}

# S2/S3 — Origin allowlist (same host set, http/https, any port). Browsers send
# Origin on every cross-origin fetch and on every POST; non-browser clients
# (curl, UAT) send none. A foreign Origin is refused server-wide (403), and
# CORS responses echo only an allowed Origin — never "*".
map $http_origin $knots_origin_ok {
	default 0;
	"" 1;
	~^https?://(localhost|node-router|knots-router|[a-z0-9-]+\.(lan|local)|(127|10)\.[0-9]+\.[0-9]+\.[0-9]+|192\.168\.[0-9]+\.[0-9]+|172\.(1[6-9]|2[0-9]|3[01])\.[0-9]+\.[0-9]+|\[[0-9a-f:.%]+\])(:[0-9]+)?$ 1;
}
map $knots_origin_ok $knots_cors_origin {
	default "";
	1 $http_origin;
}

# HTTP — redirect to HTTPS; N13 downloads + IUE Setup on cleartext until complete
server {
	listen 80 default_server;
	listen [::]:80 default_server;
	server_name node-router knots-router rnode.local 192.168.1.254 _;

	include /etc/nginx/knots-headers.inc;
	# S11 — see map above
	if ($knots_via_lan = 0) {
		return 403;
	}
	# S1/S3 — see maps above
	set $knots_cap $knots_captive;
	if (-f /etc/knots/setup-complete) {
		set $knots_cap 0;
	}
	if ($knots_cap) {
		return 302 http://$server_addr/setup.html;
	}
	if ($knots_host_ok = 0) {
		return 421;
	}
	if ($knots_origin_ok = 0) {
		return 403;
	}
	root /www/knots;
	add_header Cache-Control "no-store" always;

	set $knots_upg "";
	if (-f /tmp/knots/upgrade.active) {
		set $knots_upg "1";
	}
	set $knots_fr "";
	if (-f /tmp/knots/factory-reset.active) {
		set $knots_fr "1";
	}

	# N13 — install once over HTTP (before trusting HTTPS)
	location = /knots-ca.crt {
		include /etc/nginx/knots-headers.inc;
		alias /etc/knots/tls/ca.pem;
		default_type application/x-x509-ca-cert;
		add_header Content-Disposition 'attachment; filename="knots-ca.crt"';
		add_header Cache-Control "no-store";
	}

	# U17 / N13 — force DOWNLOAD (never inline as a page of text)
	location = /tls/install-linux.sh {
		include /etc/nginx/knots-headers.inc;
		alias /www/knots/tls/install-linux.sh;
		default_type application/octet-stream;
		add_header Content-Disposition 'attachment; filename="install-bitcoin-node-trust.sh"';
		add_header Cache-Control "no-store";
	}
	# Ubuntu / Debian / Mint: the browser hands the package to App Center.
	location = /tls/rnode-secure-connection.deb {
		include /etc/nginx/knots-headers.inc;
		alias /www/knots/tls/rnode-secure-connection.deb;
		types { }
		default_type application/vnd.debian.binary-package;
		add_header Content-Disposition 'attachment; filename="rnode-secure-connection.deb"';
		add_header Cache-Control "no-store";
	}
	location = /tls/install-macos.command {
		include /etc/nginx/knots-headers.inc;
		alias /www/knots/tls/install-macos.command;
		default_type application/octet-stream;
		add_header Content-Disposition 'attachment; filename="install-bitcoin-node-trust.command"';
		add_header Cache-Control "no-store";
	}
	location = /tls/install-windows.bat {
		include /etc/nginx/knots-headers.inc;
		alias /www/knots/tls/install-windows.bat;
		default_type application/octet-stream;
		add_header Content-Disposition 'attachment; filename="install-bitcoin-node-trust.bat"';
		add_header Cache-Control "no-store";
	}
	location = /tls/install-windows.ps1 {
		include /etc/nginx/knots-headers.inc;
		alias /www/knots/tls/install-windows.ps1;
		default_type application/octet-stream;
		add_header Content-Disposition 'attachment; filename="install-windows.ps1"';
		add_header Cache-Control "no-store";
	}
	location = /tls/ios-profile.mobileconfig {
		include /etc/nginx/knots-headers.inc;
		alias /www/knots/tls/ios-profile.mobileconfig;
		default_type application/x-apple-aspen-config;
		add_header Cache-Control "no-store";
	}
	location = /tls/knots-ca.cer {
		include /etc/nginx/knots-headers.inc;
		alias /www/knots/tls/knots-ca.cer;
		default_type application/pkix-cert;
		add_header Content-Disposition 'attachment; filename="knots-ca.cer"';
		add_header Cache-Control "no-store";
	}
	location /tls/ {
		include /etc/nginx/knots-headers.inc;
		types { }
		default_type application/octet-stream;
		add_header Content-Disposition 'attachment';
		add_header Cache-Control "no-store";
	}

	# U17 / N13 — Setup IUE on cleartext until /etc/knots/setup-complete
	# Wait pages stay on HTTP (F159). Status probes must not 302 to HTTPS —
	# that is a cross-origin redirect (http→https) and the browser drops
	# the JSON (no CORS). Then the first step bar never hears "done" and
	# looks like it restarts (F166).
	location /api/settings {
		include /etc/nginx/knots-headers.inc;
		proxy_pass http://127.0.0.1:21444/api/settings;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_read_timeout 120s;
		add_header Cache-Control "no-store";
	}

	# F204 — same as /api/settings: POST must not hit location / (302 HTTPS
	# turns POST into GET; CGI then returns "POST required").
	location /api/node {
		include /etc/nginx/knots-headers.inc;
		proxy_pass http://127.0.0.1:21444/api/node;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_read_timeout 120s;
		add_header Cache-Control "no-store";
	}

	location /api/setup {
		include /etc/nginx/knots-headers.inc;
		proxy_pass http://127.0.0.1:21444/api/setup;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_read_timeout 120s;
		add_header Cache-Control "no-store";
		add_header Access-Control-Allow-Origin $knots_cors_origin;
		add_header Vary Origin;
	}

	location = /ui-lang {
		include /etc/nginx/knots-headers.inc;
		if (-f /etc/knots/setup-complete) {
			return 302 https://$knots_rhost$request_uri;
		}
		alias /etc/knots/ui-lang;
		default_type text/plain;
		add_header Cache-Control "no-store";
	}

	location = /wait-sw.js {
		include /etc/nginx/knots-headers.inc;
		add_header Cache-Control "no-cache";
	}

	# Wait-page monitor (U13/U17): always HTTP, never 302 to HTTPS. After
	# sysupgrade -n / factory reset the CA is new; a tab left on HTTPS cannot
	# probe (cert error) and cannot fetch http:// (mixed content).
	location = /api/alive {
		include /etc/nginx/knots-headers.inc;
		default_type application/json;
		add_header Cache-Control "no-store";
		add_header Access-Control-Allow-Origin $knots_cors_origin;
		add_header Vary Origin;
		return 200 '{"ok":true,"alive":true}';
	}

	# Wait-page probe: is Node Status data actually on disk? Must not 302 to
	# HTTPS (cross-origin drop). The Status HTML stays HTTPS after Setup.
	location = /api/status {
		include /etc/nginx/knots-headers.inc;
		default_type application/json;
		alias /tmp/knots/status.json;
		sendfile off;
		add_header Cache-Control "no-store";
		add_header Access-Control-Allow-Origin $knots_cors_origin;
		add_header Vary Origin;
	}

	location ~ ^/(upgrade|reset)\.(html|js)$ {
		include /etc/nginx/knots-headers.inc;
		add_header Cache-Control "no-store";
	}
	location = /progress-wait.js {
		include /etc/nginx/knots-headers.inc;
		add_header Cache-Control "no-store";
	}
	location = /wait-handoff.js {
		include /etc/nginx/knots-headers.inc;
		add_header Cache-Control "no-store";
	}
	location ~ ^/(shell|theme|node-advisory)\.js$ {
		include /etc/nginx/knots-headers.inc;
		add_header Cache-Control "no-store";
	}
	location = /app.css {
		include /etc/nginx/knots-headers.inc;
		add_header Cache-Control "no-store";
	}

	location ~ ^/setup\.(html|js)$ {
		include /etc/nginx/knots-headers.inc;
		if (-f /etc/knots/setup-complete) {
			return 302 https://$knots_rhost$request_uri;
		}
		add_header Cache-Control "no-store";
	}

	# "Add this computer" (owner, 2026-10-26): the Secure connection page stays
	# on plain HTTP after Setup too — a computer that does not trust this
	# router yet must reach Enable Secure Connection WITHOUT a browser warning
	# first. The page sends computers that already trust it on to HTTPS.
	location ~ ^/tls\.(html|js)$ {
		include /etc/nginx/knots-headers.inc;
		add_header Cache-Control "no-store";
	}

	# H6 (review 2026-10-11): static language / OS-help assets stay on :80
	# after Setup too — the plain-HTTP wait pages need them, and a redirect
	# to https (other origin, maybe untrusted CA after -n) broke loading.
	location ~ ^/(i18n|tls-os)\.(js|css)$ {
		include /etc/nginx/knots-headers.inc;
		add_header Cache-Control "no-store";
	}

	location /i18n/ {
		include /etc/nginx/knots-headers.inc;
		add_header Cache-Control "no-store";
	}

	location = / {
		# Setup incomplete → wizard wins (F123); upgrade/reset wait pages only for
		# provisioned appliances with a live wait (F108). nginx forbids nested if —
		# flat set-flag chain instead.
		set $knots_root "https";
		if ($knots_upg = "1") { set $knots_root "upg"; }
		if ($knots_fr = "1") { set $knots_root "reset"; }
		if (-f /etc/knots/setup-complete) { set $knots_root "${knots_root}:done"; }
		if ($knots_root = "upg:done") { return 302 http://$knots_rhost/upgrade.html?go=1; }
		if ($knots_root = "reset:done") { return 302 http://$knots_rhost/reset.html?hw=1; }
		if ($knots_root = "https:done") { return 302 http://$knots_rhost/tls.html?add=1; }
		return 302 http://$knots_rhost/setup.html;
	}

	location = /index.html {
		set $knots_root "https";
		if ($knots_upg = "1") { set $knots_root "upg"; }
		if ($knots_fr = "1") { set $knots_root "reset"; }
		if (-f /etc/knots/setup-complete) { set $knots_root "${knots_root}:done"; }
		if ($knots_root = "upg:done") { return 302 http://$knots_rhost/upgrade.html?go=1; }
		if ($knots_root = "reset:done") { return 302 http://$knots_rhost/reset.html?hw=1; }
		if ($knots_root = "https:done") { return 302 http://$knots_rhost/tls.html?add=1; }
		return 302 http://$knots_rhost/setup.html;
	}

	# Everything else: provisioned → HTTPS node UI (B6/U1/N9). While Setup is
	# incomplete, stray requests (favicon, typos, history) stay in the wizard on
	# cleartext — an HTTPS redirect here forces an early untrusted-CA handshake
	# mid-IUE (F135).
	location / {
		if (-f /etc/knots/setup-complete) {
			return 302 https://$knots_rhost$request_uri;
		}
		return 302 http://$knots_rhost/setup.html;
	}
}

# LuCI HTTP → HTTPS (U1a). uhttpd serves only :8443.
server {
	listen 8080 default_server;
	listen [::]:8080 default_server;
	server_name node-router knots-router rnode.local 192.168.1.254 _;

	include /etc/nginx/knots-headers.inc;
	# S11 — see map above
	if ($knots_via_lan = 0) {
		return 403;
	}
	# S1/S3 — see maps above
	if ($knots_host_ok = 0) {
		return 421;
	}
	if ($knots_origin_ok = 0) {
		return 403;
	}
	add_header Cache-Control "no-store" always;
	return 302 https://$knots_rhost:8443$request_uri;
}

# HTTPS UI (N13 local CA — trust via /knots-ca.crt on :80)
server {
	listen 443 ssl default_server;
	listen [::]:443 ssl default_server;
	server_name node-router knots-router rnode.local 192.168.1.254 _;

	include /etc/nginx/knots-headers.inc;
	# S11 — see map above
	if ($knots_via_lan = 0) {
		return 403;
	}
	# S1/S3 — see maps above
	if ($knots_host_ok = 0) {
		return 421;
	}
	if ($knots_origin_ok = 0) {
		return 403;
	}

	ssl_certificate     /etc/knots/tls/fullchain.pem;
	ssl_certificate_key /etc/knots/tls/key.pem;
	ssl_protocols       TLSv1.2 TLSv1.3;
	ssl_session_cache   shared:KnotsUI:1m;

	root /www/knots;
	index index.html;

	# No framing anywhere in the UI (no iframes) — clickjacking/nosniff headers
	# come from knots-headers.inc (server level + every add_header location).

	# After Setup its API is locked here (404, below); a bookmarked or
	# browser-restored Setup page would run a wizard that cannot work
	# (.97 field report) — send it to Node Status instead.
	location = /setup.html {
		include /etc/nginx/knots-headers.inc;
		if (-f /etc/knots/setup-complete) {
			return 302 https://$knots_rhost/;
		}
		add_header Cache-Control "no-store";
	}

	location ~* ^/(settings|setup|tls|node|index)\.(html|js)$ {
		include /etc/nginx/knots-headers.inc;
		add_header Cache-Control "no-store";
	}
	location = /app.css {
		include /etc/nginx/knots-headers.inc;
		add_header Cache-Control "no-store";
	}

	location = /knots-ca.crt {
		include /etc/nginx/knots-headers.inc;
		alias /etc/knots/tls/ca.pem;
		default_type application/x-x509-ca-cert;
		add_header Content-Disposition 'attachment; filename="knots-ca.crt"';
		add_header Cache-Control "no-store";
	}

	# U19 — Knots UI language code
	location = /ui-lang {
		include /etc/nginx/knots-headers.inc;
		alias /etc/knots/ui-lang;
		default_type text/plain;
		add_header Cache-Control "no-store";
	}

	location = /tls/install-linux.sh {
		include /etc/nginx/knots-headers.inc;
		alias /www/knots/tls/install-linux.sh;
		default_type application/octet-stream;
		add_header Content-Disposition 'attachment; filename="install-bitcoin-node-trust.sh"';
		add_header Cache-Control "no-store";
	}
	# Ubuntu / Debian / Mint: the browser hands the package to App Center.
	location = /tls/rnode-secure-connection.deb {
		include /etc/nginx/knots-headers.inc;
		alias /www/knots/tls/rnode-secure-connection.deb;
		types { }
		default_type application/vnd.debian.binary-package;
		add_header Content-Disposition 'attachment; filename="rnode-secure-connection.deb"';
		add_header Cache-Control "no-store";
	}
	location = /tls/install-macos.command {
		include /etc/nginx/knots-headers.inc;
		alias /www/knots/tls/install-macos.command;
		default_type application/octet-stream;
		add_header Content-Disposition 'attachment; filename="install-bitcoin-node-trust.command"';
		add_header Cache-Control "no-store";
	}
	location = /tls/install-windows.bat {
		include /etc/nginx/knots-headers.inc;
		alias /www/knots/tls/install-windows.bat;
		default_type application/octet-stream;
		add_header Content-Disposition 'attachment; filename="install-bitcoin-node-trust.bat"';
		add_header Cache-Control "no-store";
	}
	location = /tls/install-windows.ps1 {
		include /etc/nginx/knots-headers.inc;
		alias /www/knots/tls/install-windows.ps1;
		default_type application/octet-stream;
		add_header Content-Disposition 'attachment; filename="install-windows.ps1"';
		add_header Cache-Control "no-store";
	}
	location = /tls/ios-profile.mobileconfig {
		include /etc/nginx/knots-headers.inc;
		alias /www/knots/tls/ios-profile.mobileconfig;
		default_type application/x-apple-aspen-config;
		add_header Cache-Control "no-store";
	}
	location = /tls/knots-ca.cer {
		include /etc/nginx/knots-headers.inc;
		alias /www/knots/tls/knots-ca.cer;
		default_type application/pkix-cert;
		add_header Content-Disposition 'attachment; filename="knots-ca.cer"';
		add_header Cache-Control "no-store";
	}
	location /tls/ {
		include /etc/nginx/knots-headers.inc;
		types { }
		default_type application/octet-stream;
		add_header Content-Disposition 'attachment';
		add_header Cache-Control "no-store";
	}

	location = /api/status {
		include /etc/nginx/knots-headers.inc;
		default_type application/json;
		alias /tmp/knots/status.json;
		sendfile off;
		add_header Cache-Control "no-store";
		add_header Access-Control-Allow-Origin $knots_cors_origin;
		add_header Vary Origin;
	}

	# Phase 3 deferred — API disabled (Phase 2 posture, W5)
	location /api/wallet {
		return 404;
	}

	# Phase 3 deferred — API disabled (Phase 2 posture, W5)
	location /api/external {
		return 404;
	}

	# Phase 3 deferred — API disabled (Phase 2 posture, W5)
	location /api/lightning {
		return 404;
	}

	# Phase 3 deferred — API disabled (Phase 2 posture, W5)
	location /api/privacy {
		return 404;
	}

	location /i18n/ {
		include /etc/nginx/knots-headers.inc;
		add_header Cache-Control "no-store";
		try_files $uri =404;
	}

	location /api/node {
		include /etc/nginx/knots-headers.inc;
		client_max_body_size 120m;
		proxy_pass http://127.0.0.1:21444/api/node;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_request_buffering on;
		proxy_read_timeout 900s;
		proxy_send_timeout 900s;
		add_header Cache-Control "no-store";
	}

	location /api/settings {
		include /etc/nginx/knots-headers.inc;
		client_max_body_size 256m;
		proxy_pass http://127.0.0.1:21444/api/settings;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_request_buffering on;
		proxy_read_timeout 900s;
		proxy_send_timeout 900s;
		add_header Cache-Control "no-store";
	}

	# Do not put proxy_pass in the same location as `if` — nginx can still
	# open the upstream and wait out proxy_read_timeout (120s), which stalls
	# Node Status (shell.js polls status).
	location /api/setup {
		error_page 418 = @knots_setup_proxy;
		set $knots_setup_ok 1;
		if (-f /etc/knots/setup-complete) {
			set $knots_setup_ok 0;
		}
		if ($arg_action = upgrade_resume) {
			set $knots_setup_ok 1;
		}
		if ($knots_setup_ok = 0) {
			return 404;
		}
		return 418;
	}
	location @knots_setup_proxy {
		include /etc/nginx/knots-headers.inc;
		# Named locations cannot use proxy_pass with a URI (nginx emerg;
		# OpenWrt then refuses to start, so :80/:443 never bind).
		proxy_pass http://127.0.0.1:21444;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_read_timeout 120s;
		add_header Cache-Control "no-store";
		add_header Access-Control-Allow-Origin $knots_cors_origin;
		add_header Vary Origin;
	}

	# Never cache shell / reset watcher (WPS auto-jump must not need Ctrl+Shift+R)
	location = /shell.js {
		include /etc/nginx/knots-headers.inc;
		add_header Cache-Control "no-store";
	}
	location = /progress-wait.js {
		include /etc/nginx/knots-headers.inc;
		add_header Cache-Control "no-store";
	}
	location = /wait-handoff.js {
		include /etc/nginx/knots-headers.inc;
		add_header Cache-Control "no-store";
	}
	location = /upgrade.js {
		include /etc/nginx/knots-headers.inc;
		add_header Cache-Control "no-store";
	}
	location = /reset.js {
		include /etc/nginx/knots-headers.inc;
		add_header Cache-Control "no-store";
	}
	location = /theme.js {
		include /etc/nginx/knots-headers.inc;
		add_header Cache-Control "no-store";
	}
	location = /reset.html {
		include /etc/nginx/knots-headers.inc;
		add_header Cache-Control "no-store";
	}
	location = /upgrade.html {
		include /etc/nginx/knots-headers.inc;
		add_header Cache-Control "no-store";
	}
	location = /wait-sw.js {
		include /etc/nginx/knots-headers.inc;
		add_header Cache-Control "no-cache";
	}

	# Firmware update LIVE this boot → /upgrade.html (takes priority over factory reset)
	set $knots_upg "";
	if (-f /tmp/knots/upgrade.active) {
		set $knots_upg "1";
	}
	# If factory reset is LIVE this boot, send browser to the reset page
	set $knots_fr "";
	if (-f /tmp/knots/factory-reset.active) {
		set $knots_fr "1";
	}

	location = / {
		if ($knots_upg = "1") {
			return 302 http://$knots_rhost/upgrade.html?go=1;
		}
		if ($knots_fr = "1") {
			return 302 http://$knots_rhost/reset.html?hw=1;
		}
		# HTTPS / mid-IUE: CA is trusted — resume Setup at Choice, not Welcome.
		if (!-f /etc/knots/setup-complete) {
			return 302 https://$knots_rhost/setup.html?after_tls=1;
		}
		try_files /index.html =404;
	}
	location = /index.html {
		include /etc/nginx/knots-headers.inc;
		if ($knots_upg = "1") {
			return 302 http://$knots_rhost/upgrade.html?go=1;
		}
		if ($knots_fr = "1") {
			return 302 http://$knots_rhost/reset.html?hw=1;
		}
		if (!-f /etc/knots/setup-complete) {
			return 302 https://$knots_rhost/setup.html?after_tls=1;
		}
		add_header Cache-Control "no-store";
	}
	location = /settings.html {
		include /etc/nginx/knots-headers.inc;
		if ($knots_upg = "1") {
			return 302 http://$knots_rhost/upgrade.html?go=1;
		}
		if ($knots_fr = "1") {
			return 302 http://$knots_rhost/reset.html?hw=1;
		}
		add_header Cache-Control "no-store";
	}
	location = /node.html {
		include /etc/nginx/knots-headers.inc;
		if ($knots_upg = "1") {
			return 302 http://$knots_rhost/upgrade.html?go=1;
		}
		if ($knots_fr = "1") {
			return 302 http://$knots_rhost/reset.html?hw=1;
		}
		add_header Cache-Control "no-store";
	}

	location / {
		try_files $uri $uri/ /index.html;
	}
}

# Legacy :21443 bookmarks → primary HTTPS UI
server {
	listen 21443 ssl;
	listen [::]:21443 ssl;
	server_name node-router knots-router rnode.local 192.168.1.254 _;

	include /etc/nginx/knots-headers.inc;
	# S11 — see map above
	if ($knots_via_lan = 0) {
		return 403;
	}
	# S1/S3 — see maps above
	if ($knots_host_ok = 0) {
		return 421;
	}
	if ($knots_origin_ok = 0) {
		return 403;
	}

	ssl_certificate     /etc/knots/tls/fullchain.pem;
	ssl_certificate_key /etc/knots/tls/key.pem;
	ssl_protocols       TLSv1.2 TLSv1.3;
	ssl_session_cache   shared:KnotsUI:1m;

	add_header Cache-Control "no-store" always;
	return 302 https://$knots_rhost/;
}
