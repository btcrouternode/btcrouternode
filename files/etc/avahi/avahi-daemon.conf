# U17/N13 — publish http://rnode.local/ on the LAN via mDNS.
# NOTE: we publish rnode as the avahi HOST NAME. A static /etc/avahi/hosts
# alias for the router's own IP fails with "Local name collision" (its reverse
# record clashes with the host name's — verified on .48 and again on .103), so
# the unit's own name rnode-XXXX.local is published by knots-mdns-alias with
# avahi-publish -R (no reverse record; needs this D-Bus build).
# LAN only — never advertise the IUE entry on WAN.
[server]
host-name=rnode
#domain-name=local
use-ipv4=yes
use-ipv6=no
check-response-ttl=no
use-iff-running=no
allow-interfaces=br-lan

[publish]
publish-addresses=yes
publish-hinfo=yes
publish-workstation=no
publish-domain=yes
# Ubuntu/systemd-resolved prefers AAAA. Publishing ULA/link-local AAAA for
# rnode.local makes browsers hang on IPv6 (F170) even when IPv4 would work.
publish-aaaa-on-ipv4=no
publish-a-on-ipv6=no
#publish-dns-servers=192.168.1.1
#publish-resolv-conf-dns-servers=yes

[reflector]
enable-reflector=no
reflect-ipv=no

[rlimits]
#rlimit-as=
rlimit-core=0
rlimit-data=4194304
rlimit-fsize=0
rlimit-nofile=30
rlimit-stack=4194304
rlimit-nproc=3
