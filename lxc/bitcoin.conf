# Bitcoin Knots — Product Phase 2 Node SKU (B9)
# datadir is bind-mounted at /mnt/bitcoin
# Phase 3 (W8) may set disablewallet=0 under controlled migration — do not wipe chain

prune=0
disablewallet=1
txindex=0

listen=1
server=1
port=8333
rpcport=8332

# Clearnet only for v1 - avoid onion/clearnet shared-bind warning
listenonion=0

bind=21.21.21.21
bind=[fd21:21:21::21]
rpcbind=21.21.21.21
# Router (.1) for node UI; container (.21) for local bitcoin-cli
# P2P also on DMZ ULA (N6a); RPC stays IPv4-only — never WAN IPv6
rpcallowip=21.21.21.0/24

# cookie auth in datadir (.cookie) - preferred v1
# no rpcuser/rpcpassword

# BPI-R4 ~4 GiB RAM - keep headroom for OpenWrt
dbcache=1024
datadir=/mnt/bitcoin
pid=/run/bitcoind.pid
